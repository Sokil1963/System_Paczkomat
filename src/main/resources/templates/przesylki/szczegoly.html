<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Przesyłki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <a href="/przesylki" class="btn btn-secondary mb-3">← Powrót do listy</a>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="card" th:if="${przesylka}">
            <div class="card-header">
                <h2>Szczegóły Przesyłki</h2>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID:</dt>
                    <dd class="col-sm-9" th:text="${przesylka.id}"></dd>

                    
                    <dt class="col-sm-3">Opis:</dt>
                    <dd class="col-sm-9" th:text="${przesylka.opis}"></dd>
                    
                    <dt class="col-sm-3">Status:</dt>
                    <dd class="col-sm-9">
                        <span class="badge bg-info" th:if="${przesylka.aktualnyStatus}" 
                              th:text="${przesylka.aktualnyStatus.kod}"></span>
                        <span class="text-muted" th:unless="${przesylka.aktualnyStatus}">Brak statusu</span>
                    </dd>
                </dl>

                <div class="mt-4">
                    <h4>Aktualizuj kod odbioru</h4>
                    <form th:action="@{/przesylki/{id}/kod_odbioru(id=${przesylka.id})}" method="post">
                        <div class="mb-3">
                            <label for="kod_odbioru" class="form-label">Nowy kod odbioru:</label>
                            <input type="text" class="form-control" id="kod_odbioru" name="kod_odbioru" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Zmień kod</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
