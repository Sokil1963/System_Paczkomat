<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowa Przesyłka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <h1>Dodaj nową przesyłkę</h1>

        <form th:action="@{/przesylki}" th:object="${przesylka}" method="post" novalidate>
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Błędy walidacji:</strong>
                <ul>
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="mb-3">
                <label for="opis" class="form-label">Opis:</label>
                <textarea class="form-control"
                          id="opis"
                          th:field="*{opis}"
                          th:classappend="${#fields.hasErrors('opis')} ? 'is-invalid'"
                          rows="3"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('opis')}">
                    <span th:each="err : ${#fields.errors('opis')}" th:text="${err}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label for="gabaryt" class="form-label">Gabaryt:</label>
                <select class="form-control" id="gabaryt" th:field="*{gabaryt}">
                    <option value="">Wybierz gabaryt</option>
                    <option value="A">A - Mały</option>
                    <option value="B">B - Średni</option>
                    <option value="C">C - Duży</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="waga" class="form-label">Waga (kg):</label>
                <input type="number"
                       step="0.01"
                       min="0"
                       class="form-control"
                       id="waga"
                       th:field="*{waga}"
                       th:classappend="${#fields.hasErrors('waga')} ? 'is-invalid'"
                       oninput="this.value = this.value < 0 ? '' : this.value">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('waga')}">
                    <span th:each="err : ${#fields.errors('waga')}" th:text="${err}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label for="kodOdbioru" class="form-label">Kod odbioru:</label>
                <input type="text"
                       class="form-control"
                       id="kodOdbioru"
                       th:field="*{kodOdbioru}"
                       th:classappend="${#fields.hasErrors('kodOdbioru')} ? 'is-invalid'"
                       required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('kodOdbioru')}">
                    <span th:each="err : ${#fields.errors('kodOdbioru')}" th:text="${err}"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Zapisz</button>
            <a href="/przesylki" class="btn btn-secondary">Anuluj</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
