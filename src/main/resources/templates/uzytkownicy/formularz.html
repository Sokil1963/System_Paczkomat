<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowy Użytkownik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <h1>Dodaj nowego użytkownika</h1>
        <form th:action="@{/uzytkownicy}" th:object="${uzytkownik}" method="post">
            <div class="mb-3">
                <label for="login" class="form-label">Login:</label>
                <input type="text" class="form-control" id="login" th:field="*{login}" required>
            </div>
            <div class="mb-3">
                <label for="hasloHash" class="form-label">Hasło:</label>
                <input type="password" class="form-control" id="hasloHash" th:field="*{hasloHash}" required>
            </div>
            <div class="mb-3">
                <label for="rola" class="form-label">Rola:</label>
                <select class="form-control" id="rola" th:field="*{rola}" required>
                    <option value="">Wybierz rolę</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="KURIER">KURIER</option>
                    <option value="FIXER">FIXER</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Zapisz</button>
            <a href="/uzytkownicy" class="btn btn-secondary">Anuluj</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
