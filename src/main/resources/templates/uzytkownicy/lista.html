<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Użytkowników</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Lista Użytkowników</h1>
            <a href="/uzytkownicy/nowy" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">Dodaj nowego użytkownika</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Login</th>
                    <th>Rola</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="uzytkownik : ${uzytkownicy}">
                    <td th:text="${uzytkownik.id}"></td>
                    <td th:text="${uzytkownik.login}"></td>
                    <td>
                        <span class="badge" 
                              th:classappend="${uzytkownik.rola == 'ADMIN'} ? 'bg-danger' : (${uzytkownik.rola == 'KURIER'} ? 'bg-primary' : 'bg-warning')"
                              th:text="${uzytkownik.rola}"></span>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/uzytkownicy/{id}(id=${uzytkownik.id})}" class="btn btn-sm btn-info">Szczegóły</a>
                        <form th:action="@{/uzytkownicy/{id}/usun(id=${uzytkownik.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Czy na pewno chcesz usunąć?')">Usuń</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
