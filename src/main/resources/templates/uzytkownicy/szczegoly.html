<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Użytkownika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <a href="/uzytkownicy" class="btn btn-secondary mb-3">← Powrót do listy</a>
        
        <div class="card" th:if="${uzytkownik}">
            <div class="card-header">
                <h2>Szczegóły Użytkownika</h2>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID:</dt>
                    <dd class="col-sm-9" th:text="${uzytkownik.id}"></dd>
                    
                    <dt class="col-sm-3">Login:</dt>
                    <dd class="col-sm-9" th:text="${uzytkownik.login}"></dd>
                    
                    <dt class="col-sm-3">Rola:</dt>
                    <dd class="col-sm-9">
                        <span class="badge" 
                              th:classappend="${uzytkownik.rola == 'ADMIN'} ? 'bg-danger' : (${uzytkownik.rola == 'KURIER'} ? 'bg-primary' : 'bg-warning')"
                              th:text="${uzytkownik.rola}"></span>
                    </dd>
                </dl>
            </div>
            <div class="card" th:if="${uzytkownik}">
                <div class="card-header">Edycja Użytkownika</div>
                <div class="card-body">
                    <form th:action="@{/uzytkownicy/{id}/edytuj(id=${uzytkownik.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Login:</label>
                            <input type="text" class="form-control" name="login" th:value="${uzytkownik.login}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nowe Hasło (zostaw puste aby nie zmieniać):</label>
                            <input type="password" class="form-control" name="haslo">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Rola:</label>
                            <input type="text" class="form-control" th:value="${uzytkownik.rola}" disabled readonly>
                            <small class="text-muted">Roli nie można zmienić w tym widoku.</small>
                        </div>

                        <button type="submit" class="btn btn-warning">Zaktualizuj dane</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
