<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - System Paczkomatów</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center mb-0">System Zarządzania Paczkomatami</h3>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title text-center mb-4">Logowanie</h5>
                        
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="login" class="form-label">Login:</label>
                                <input type="text" class="form-control" id="login" name="login" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="haslo" class="form-label">Hasło:</label>
                                <input type="password" class="form-control" id="haslo" name="haslo" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Zaloguj się</button>
                        </form>
                    </div>
                </div>
                
                <div class="mt-3 text-center">
                    <small class="text-muted">
                        Role w systemie: ADMIN, KURIER, FIXER
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
