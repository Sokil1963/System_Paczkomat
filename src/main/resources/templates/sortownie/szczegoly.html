<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Sortowni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <a href="/sortownie" class="btn btn-secondary mb-3">← Powrót do listy</a>
        
        <div class="card" th:if="${sortownia}">
            <div class="card-header">
                <h2>Szczegóły Sortowni</h2>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID:</dt>
                    <dd class="col-sm-9" th:text="${sortownia.id}"></dd>
                    
                    <dt class="col-sm-3">Nazwa:</dt>
                    <dd class="col-sm-9" th:text="${sortownia.nazwa}"></dd>
                    
                    <dt class="col-sm-3">Adres:</dt>
                    <dd class="col-sm-9" th:text="${sortownia.adres}"></dd>
                </dl>
            </div>
            <div class="card" th:if="${sortownia}">
                <div class="card-header">Edycja Sortowni</div>
                <div class="card-body">
                    <form th:action="@{/sortownie/{id}/edytuj(id=${sortownia.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nazwa:</label>
                            <input type="text" class="form-control" name="nazwa" th:value="${sortownia.nazwa}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Adres:</label>
                            <textarea class="form-control" name="adres" th:text="${sortownia.adres}" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning">Zapisz zmiany</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
