<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Paczkomatów</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Lista Paczkomatów</h1>
            <a href="/paczkomaty/nowy" class="btn btn-primary">Dodaj nowy paczkomat</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Kod</th>
                    <th>Adres</th>
                    <th>Status</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="paczkomat : ${paczkomaty}">
                    <td th:text="${paczkomat.id}"></td>
                    <td th:text="${paczkomat.kod}"></td>
                    <td th:text="${paczkomat.adres}"></td>
                    <td>
                        <span class="badge" 
                              th:classappend="${paczkomat.status == 'AKTYWNY'} ? 'bg-success' : 'bg-danger'"
                              th:text="${paczkomat.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/paczkomaty/{id}(id=${paczkomat.id})}" class="btn btn-sm btn-info">Szczegóły</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
