<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zgłoszenia nieprawidłowości</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📋 Zgłoszenia nieprawidłowych przesyłek</h1>
            <a href="/zgloszenia/nowe" class="btn btn-danger">+ Nowe zgłoszenie</a>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Filtry -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-auto">
                        <strong>Filtruj po typie:</strong>
                    </div>
                    <div class="col">
                        <a href="/zgloszenia" class="btn btn-sm"
                           th:classappend="${filtrowanyTyp == null} ? 'btn-primary' : 'btn-outline-primary'">
                            Wszystkie
                        </a>
                        <a href="/zgloszenia/typ/USZKODZONA" class="btn btn-sm"
                           th:classappend="${filtrowanyTyp == 'USZKODZONA'} ? 'btn-warning' : 'btn-outline-warning'">
                            🔨 Uszkodzone
                        </a>
                        <a href="/zgloszenia/typ/ZAGUBIONA" class="btn btn-sm"
                           th:classappend="${filtrowanyTyp == 'ZAGUBIONA'} ? 'btn-danger' : 'btn-outline-danger'">
                            ❓ Zagubione
                        </a>
                        <a href="/zgloszenia/typ/INNA" class="btn btn-sm"
                           th:classappend="${filtrowanyTyp == 'INNA'} ? 'btn-secondary' : 'btn-outline-secondary'">
                            📝 Inne
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(zgloszenia)}" class="alert alert-info">
            Brak zgłoszeń do wyświetlenia.
        </div>

        <div th:unless="${#lists.isEmpty(zgloszenia)}" class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Data zgłoszenia</th>
                        <th>Typ</th>
                        <th>Przesyłka</th>
                        <th>Zgłaszający</th>
                        <th>Opis</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="z : ${zgloszenia}">
                        <td th:text="${z.id}"></td>
                        <td th:text="${#temporals.format(z.dataZgloszenia, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${z.typ == 'USZKODZONA'} ? 'bg-warning' : (${z.typ == 'ZAGUBIONA'} ? 'bg-danger' : 'bg-secondary')"
                                  th:text="${z.typ}"></span>
                        </td>
                        <td>
                            <a th:if="${z.przesylka}"
                               th:href="@{/przesylki/{id}(id=${z.przesylka.id})}"
                               th:text="'#' + ${z.przesylka.id}"></a>
                        </td>
                        <td th:text="${z.zglaszajacy != null ? z.zglaszajacy.login : '-'}"></td>
                        <td th:text="${#strings.abbreviate(z.opis, 50)}"></td>
                        <td>
                            <a th:href="@{/zgloszenia/{id}(id=${z.id})}" class="btn btn-sm btn-outline-primary">
                                Szczegóły
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
