<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły zgłoszenia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <a href="/zgloszenia" class="btn btn-secondary mb-3">← Powrót do listy</a>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${zgloszenie}" class="card">
            <div class="card-header d-flex justify-content-between align-items-center"
                 th:classappend="${zgloszenie.typ == 'USZKODZONA'} ? 'bg-warning' : (${zgloszenie.typ == 'ZAGUBIONA'} ? 'bg-danger text-white' : 'bg-secondary text-white')">
                <h2 class="mb-0">
                    Zgłoszenie #<span th:text="${zgloszenie.id}"></span>
                </h2>
                <span class="badge bg-light text-dark fs-6" th:text="${zgloszenie.typ}"></span>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID zgłoszenia:</dt>
                    <dd class="col-sm-9" th:text="${zgloszenie.id}"></dd>

                    <dt class="col-sm-3">Data zgłoszenia:</dt>
                    <dd class="col-sm-9" th:text="${#temporals.format(zgloszenie.dataZgloszenia, 'yyyy-MM-dd HH:mm:ss')}"></dd>

                    <dt class="col-sm-3">Typ:</dt>
                    <dd class="col-sm-9">
                        <span class="badge fs-6"
                              th:classappend="${zgloszenie.typ == 'USZKODZONA'} ? 'bg-warning text-dark' : (${zgloszenie.typ == 'ZAGUBIONA'} ? 'bg-danger' : 'bg-secondary')">
                            <span th:if="${zgloszenie.typ == 'USZKODZONA'}">🔨 </span>
                            <span th:if="${zgloszenie.typ == 'ZAGUBIONA'}">❓ </span>
                            <span th:if="${zgloszenie.typ == 'INNA'}">📝 </span>
                            <span th:text="${zgloszenie.typ}"></span>
                        </span>
                    </dd>

                    <dt class="col-sm-3">Zgłaszający:</dt>
                    <dd class="col-sm-9" th:text="${zgloszenie.zglaszajacy != null ? zgloszenie.zglaszajacy.login : 'Nieznany'}"></dd>

                    <dt class="col-sm-3">Opis:</dt>
                    <dd class="col-sm-9">
                        <p th:if="${zgloszenie.opis}" th:text="${zgloszenie.opis}" class="mb-0"></p>
                        <span th:unless="${zgloszenie.opis}" class="text-muted">Brak opisu</span>
                    </dd>
                </dl>

                <!-- Powiązana przesyłka -->
                <div th:if="${zgloszenie.przesylka}" class="card mt-4 border-info">
                    <div class="card-header bg-info text-white">
                        📦 Powiązana przesyłka
                    </div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-3">ID przesyłki:</dt>
                            <dd class="col-sm-9">
                                <a th:href="@{/przesylki/{id}(id=${zgloszenie.przesylka.id})}"
                                   th:text="'#' + ${zgloszenie.przesylka.id}"></a>
                            </dd>

                            <dt class="col-sm-3">Opis:</dt>
                            <dd class="col-sm-9" th:text="${zgloszenie.przesylka.opis}"></dd>

                            <dt class="col-sm-3">Aktualny status:</dt>
                            <dd class="col-sm-9">
                                <span th:if="${zgloszenie.przesylka.aktualnyStatus}" class="badge bg-secondary"
                                      th:text="${zgloszenie.przesylka.aktualnyStatus.kod}"></span>
                                <span th:unless="${zgloszenie.przesylka.aktualnyStatus}" class="text-muted">Brak</span>
                            </dd>
                        </dl>
                        <a th:href="@{/przesylki/{id}(id=${zgloszenie.przesylka.id})}" class="btn btn-outline-info mt-3">
                            Zobacz szczegóły przesyłki →
                        </a>
                    </div>
                </div>

                <!-- Akcje -->
                <div class="mt-4 d-flex gap-2">
                    <a th:if="${zgloszenie.przesylka}"
                       th:href="@{/przesylki/{id}(id=${zgloszenie.przesylka.id})}"
                       class="btn btn-primary">
                        Przejdź do przesyłki
                    </a>
                    <form th:action="@{/zgloszenia/{id}/usun(id=${zgloszenie.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Czy na pewno usunąć to zgłoszenie?');">
                        <button type="submit" class="btn btn-outline-danger">
                            🗑️ Usuń zgłoszenie
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div th:unless="${zgloszenie}" class="alert alert-warning">
            Nie znaleziono zgłoszenia.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
