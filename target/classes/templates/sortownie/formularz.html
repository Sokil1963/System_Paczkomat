<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowa Sortownia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <h1>Dodaj nową sortownię</h1>
        <form th:action="@{/sortownie}" th:object="${sortownia}" method="post">
            <div class="mb-3">
                <label for="nazwa" class="form-label">Nazwa:</label>
                <input type="text" class="form-control" id="nazwa" th:field="*{nazwa}" required>
            </div>
            <div class="mb-3">
                <label for="adres" class="form-label">Adres:</label>
                <textarea class="form-control" id="adres" th:field="*{adres}" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Zapisz</button>
            <a href="/sortownie" class="btn btn-secondary">Anuluj</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
