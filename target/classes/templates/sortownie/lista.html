<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Sortowni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Lista Sortowni</h1>
            <a href="/sortownie/nowa" class="btn btn-primary">Dodaj nową sortownię</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nazwa</th>
                    <th>Adres</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sortownia : ${sortownie}">
                    <td th:text="${sortownia.id}"></td>
                    <td th:text="${sortownia.nazwa}"></td>
                    <td th:text="${sortownia.adres}"></td>
                    <td>
                        <a th:href="@{/sortownie/{id}(id=${sortownia.id})}" class="btn btn-sm btn-info">Szczegóły</a>
                        <form th:action="@{/sortownie/{id}/usun(id=${sortownia.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Czy na pewno chcesz usunąć?')">Usuń</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
