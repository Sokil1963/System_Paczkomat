<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Zadania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <a href="/zadania" class="btn btn-secondary mb-3">← Powrót do listy</a>
        
        <div class="card" th:if="${zadanie}">
            <div class="card-header">
                <h2>Szczegóły Zadania</h2>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID:</dt>
                    <dd class="col-sm-9" th:text="${zadanie.id}"></dd>
                    
                    <dt class="col-sm-3">Typ:</dt>
                    <dd class="col-sm-9" th:text="${zadanie.typ}"></dd>
                    
                    <dt class="col-sm-3">Status:</dt>
                    <dd class="col-sm-9">
                        <span class="badge bg-info" th:text="${zadanie.status}"></span>
                    </dd>
                    
                    <dt class="col-sm-3">Data startu:</dt>
                    <dd class="col-sm-9">
                        <span th:if="${zadanie.dataStartu != null}" th:text="${#temporals.format(zadanie.dataStartu, 'yyyy-MM-dd HH:mm')}"></span>
                        <span th:unless="${zadanie.dataStartu != null}">—</span>
                    </dd>
                </dl>

                <div class="card mb-4" th:if="${zadanie}">
                    <div class="card-header bg-primary text-white">Edycja Zadania</div>
                    <div class="card-body">
                        <form th:action="@{/zadania/{id}/edytuj(id=${zadanie.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Typ:</label>
                                <input type="text" class="form-control" name="typ" th:value="${zadanie.typ}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status:</label>
                                <select class="form-select" name="status">
                                    <option value="ZAPLANOWANE" th:selected="${zadanie.status == 'ZAPLANOWANE'}">ZAPLANOWANE</option>
                                    <option value="W_TRAKCIE" th:selected="${zadanie.status == 'W_TRAKCIE'}">W_TRAKCIE</option>
                                    <option value="ZAKONCZONE" th:selected="${zadanie.status == 'ZAKONCZONE'}">ZAKONCZONE</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-warning">Zapisz zmiany</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
