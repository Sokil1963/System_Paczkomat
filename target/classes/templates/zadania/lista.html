<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Zadań</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Lista Zadań Dystrybucyjnych</h1>
            <a href="/zadania/nowe" class="btn btn-primary">Dodaj nowe zadanie</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Typ</th>
                    <th>Status</th>
                    <th>Data startu</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="zadanie : ${zadania}">
                    <td th:text="${zadanie.id}"></td>
                    <td th:text="${zadanie.typ}"></td>
                    <td>
                        <span class="badge bg-info" th:text="${zadanie.status}"></span>
                    </td>
                    <td>
                        <span th:if="${zadanie.dataStartu != null}" th:text="${#temporals.format(zadanie.dataStartu, 'yyyy-MM-dd HH:mm')}"></span>
                        <span th:unless="${zadanie.dataStartu != null}">—</span>
                    </td>
                    <td>
                        <a th:href="@{/zadania/{id}(id=${zadanie.id})}" class="btn btn-sm btn-info">Szczegóły</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
