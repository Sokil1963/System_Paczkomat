<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Przesyłek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Lista Przesyłek</h1>
            <div>
                <a href="/przesylki/nowa" class="btn btn-success me-2">Dodaj nową przesyłkę</a>
                <a href="/przesylki/szukaj" class="btn btn-primary">Szukaj przesyłki</a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Numer</th>
                    <th>Opis</th>
                    <th>Status</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="przesylka : ${przesylki}">
                    <td th:text="${przesylka.id}"></td>
                    <td th:text="${przesylka.numer}"></td>
                    <td th:text="${przesylka.opis}"></td>
                    <td>
                        <span class="badge bg-info" th:if="${przesylka.aktualnyStatus}" 
                              th:text="${przesylka.aktualnyStatus.kod}"></span>
                        <span class="text-muted" th:unless="${przesylka.aktualnyStatus}">Brak statusu</span>
                    </td>
                    <td>
                        <a th:href="@{/przesylki/{id}(id=${przesylka.id})}" class="btn btn-sm btn-info">Szczegóły</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
